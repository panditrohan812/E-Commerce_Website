<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Shopingo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ==========================================
         SIMPLE NAVBAR (same as cart page)
         ========================================== -->
    <header class="main-header">
        <div class="container">
            <div class="row align-items-center g-3">
                <div class="col-lg-2 col-6">
                    <a href="index.html" class="logo-text">SHOPINGO<small>eCommerce</small></a>
                </div>
                <div class="col-lg-5 order-lg-2 order-3">
                    <form class="search-form" id="headerSearchForm">
                        <input type="text" placeholder="Search for Products">
                        <button type="submit"><i class="bi bi-search"></i> Search</button>
                    </form>
                </div>
                <div class="col-lg-5 col-6 order-lg-3 order-2">
                    <div class="d-flex justify-content-end align-items-center header-icons">
                        <a href="#" class="icon-link"><i class="bi bi-person"></i></a>
                        <a href="#" class="icon-link"><i class="bi bi-heart"></i></a>
                        <a href="cart.html" class="icon-link"><i class="bi bi-bag"></i><span class="badge-count"
                                data-cart-count>0</span></a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Page header -->
    <section class="page-header">
        <h2>Checkout</h2>
        <div class="breadcrumb-nav">
            <a href="index.html">Home</a>
            <i class="bi bi-chevron-right"></i>
            <a href="cart.html">Cart</a>
            <i class="bi bi-chevron-right"></i>
            <span>Checkout</span>
        </div>
    </section>

    <!-- ==========================================
         CHECKOUT FORM
         ========================================== -->
    <section class="py-5">
        <div class="container">
            <div class="row g-4">

                <!-- LEFT SIDE: Customer + Payment form -->
                <div class="col-lg-8">
                    <div class="filter-widget">
                        <h6>Shipping Details</h6>
                        <form id="checkoutForm" novalidate>
                            <div class="row g-3">
                                <!-- Name -->
                                <div class="col-md-6">
                                    <label class="form-label">First Name *</label>
                                    <input type="text" class="form-control" id="firstName" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Last Name</label>
                                    <input type="text" class="form-control" id="lastName">
                                </div>
                                <!-- Contact -->
                                <div class="col-md-6">
                                    <label class="form-label">Email *</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Phone *</label>
                                    <input type="tel" class="form-control" id="phone" required>
                                </div>
                                <!-- Address -->
                                <div class="col-12">
                                    <label class="form-label">Address *</label>
                                    <input type="text" class="form-control" id="address" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">City</label>
                                    <input type="text" class="form-control" id="city">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">State</label>
                                    <input type="text" class="form-control" id="state">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Zip Code *</label>
                                    <input type="text" class="form-control" id="zip" required>
                                </div>
                            </div>

                            <hr class="my-4">

                            <h6>Payment Method</h6>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="payment" id="payCard"
                                    value="Credit / Debit Card" checked>
                                <label class="form-check-label" for="payCard">Credit / Debit Card</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="payment" id="payPaypal"
                                    value="PayPal">
                                <label class="form-check-label" for="payPaypal">PayPal</label>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="radio" name="payment" id="payCod"
                                    value="Cash on Delivery">
                                <label class="form-check-label" for="payCod">Cash on Delivery</label>
                            </div>

                            <!-- Card fields (only for card payment) -->
                            <div id="cardDetails">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Card Number</label>
                                        <input type="text" class="form-control" id="cardNumber"
                                            placeholder="1234 5678 9012 3456">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">Expiry</label>
                                        <input type="text" class="form-control" id="cardExpiry" placeholder="MM/YY">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">CVC</label>
                                        <input type="text" class="form-control" id="cardCvc" placeholder="123">
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="btn-shop mt-4 w-100">Place Order</button>
                        </form>
                    </div>
                </div>

                <!-- RIGHT SIDE: Order Summary -->
                <div class="col-lg-4">
                    <div class="cart-summary-box">
                        <h5>Order Summary</h5>
                        <div id="summaryItems">
                            <!-- items will be added by checkout.js -->
                        </div>
                        <div class="summary-row"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
                        <div class="summary-row"><span>Shipping</span><span id="shipping">$0.00</span></div>
                        <div class="summary-row total"><span>Total</span><span id="total">$0.00</span></div>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom d-flex flex-wrap justify-content-between align-items-center">
                <span>Copyright &copy; 2026 Shopingo. All rights reserved.</span>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/checkout.js"></script>
</body>

</html>
